# Main dataset (~30k states with 2000 games; raise n_games to extend, finished games are reused).
seed: 0
out_dir: data/main
n_games: 2000
n_workers: 96
game:
  speeds: [1.2, 2.2, 3.5]      # m/s: soft / medium / firm (center ball, a=b=0)
  top_k_pairs: 8               # easiest (ball, pocket) pairs kept per state
  n_rollouts: 16               # M noisy rollouts per candidate (teacher label)
  choice_temperature: 0.05     # softmax temperature of simulated players
  max_shots: 200               # racks longer than this are discarded
skills:                        # execution noise std per level
  beginner:     {phi_std: 1.5,  v_rel_std: 0.20, spin_std: 0.12}
  intermediate: {phi_std: 0.4,  v_rel_std: 0.07, spin_std: 0.05}
  expert:       {phi_std: 0.12, v_rel_std: 0.03, spin_std: 0.02}
